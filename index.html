<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meatopia Tickets</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="container nav">
    <div class="logo">MEATOPIA</div>

    <nav class="nav-links">
      <a href="index.html">Tickets</a>
      <a href="verify.html">Verify</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
</header>


<main>

<div class="container">

<section class="hero">
  <h1>MEATOPIA</h1>
  <p>OFFICIAL ONLINE TICKETS</p>
  <p>30 September 2026 • Moshupa AOG</p>
</section>


<section class="card">

<h2>Get Your Ticket</h2>

<form id="ticketForm">

<div class="form-group">
<label>Ticket Holder Name</label>

<input
  id="customerName"
  type="text"
  placeholder="Enter full name"
  required
>
</div>


<div class="form-group">
<label>Ticket Type</label>

<select id="ticketType" required>

<option value="">Select ticket type</option>

<option value="Early Bird">Early Bird — P80</option>

<option value="Standard">Standard — P100</option>

<option value="Children">Children — P50</option>

<option value="Group">Group — P500</option>

</select>
</div>


<button
  type="submit"
  class="btn"
  id="submitButton"
>
Submit Ticket Order
</button>

</form>


<div
  id="message"
  style="margin-top:20px;font-weight:bold;"
>
READY
</div>

</section>


<section
  id="ticketResult"
  class="card hidden"
>

<h2>Ticket Created</h2>

<p>
<strong>Holder:</strong>
<span id="displayName"></span>
</p>

<p>
<strong>Type:</strong>
<span id="displayType"></span>
</p>

<p>
<strong>Price:</strong>
<span id="displayPrice"></span>
</p>

<p>
<strong>Ticket ID:</strong>
<span id="displayTicketId"></span>
</p>

<p>
<strong>Status:</strong>
<span id="displayStatus">PENDING</span>
</p>

<div
  id="qrcode"
  style="margin-top:20px;"
></div>

</section>


</div>

</main>


<footer>
<div class="container">
<p>© 2026 Meatopia</p>
</div>
</footer>


<!-- QR CODE -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://kqvekxywsyjuhjggwrpa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-j0nUXgSet2ihzJimLkSZg_hHimaaPm";


const message =
document.getElementById("message");

const form =
document.getElementById("ticketForm");

const button =
document.getElementById("submitButton");


message.textContent =
"JavaScript is working. Supabase is loading...";


/* CHECK SUPABASE */

if (!window.supabase) {

message.textContent =
"ERROR: Supabase library did not load.";

throw new Error(
"Supabase library missing"
);

}


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


message.textContent =
"READY — Supabase connected.";


/* PRICES */

const prices = {

"Early Bird": 80,

"Standard": 100,

"Children": 50,

"Group": 500

};


/* TICKET ID */

function createTicketId() {

return "MTP-" +
Math.random()
.toString(36)
.substring(2,10)
.toUpperCase();

}


/* FORM */

form.addEventListener(
"submit",
async function(event) {

event.preventDefault();


message.textContent =
"Button received. Creating ticket...";


const name =
document
.getElementById("customerName")
.value
.trim();


const type =
document
.getElementById("ticketType")
.value;


if (!name || !type) {

message.textContent =
"Please enter a name and select a ticket.";

return;

}


const price =
prices[type];


const ticketId =
createTicketId();


button.disabled =
true;


button.textContent =
"Creating...";


message.textContent =
"Saving " + ticketId + " to Supabase...";


try {


const response =
await supabaseClient
.from("Tickets.aog")
.insert({

ticket_id: ticketId,

holder_name: name,

ticket_type: type,

price: price,

status: "pending",

event_date: "2026-09-30",

venue: "Moshupa AOG"

});


console.log(
"SUPABASE RESPONSE:",
response
);


if (response.error) {

message.textContent =
"SUPABASE ERROR: " +
response.error.message;

console.error(
response.error
);

button.disabled =
false;

button.textContent =
"Submit Ticket Order";

return;

}


/* SUCCESS */

message.textContent =
"SUCCESS! Ticket saved.";


document.getElementById(
"displayName"
).textContent =
name;


document.getElementById(
"displayType"
).textContent =
type;


document.getElementById(
"displayPrice"
).textContent =
"P" + price;


document.getElementById(
"displayTicketId"
).textContent =
ticketId;


document.getElementById(
"displayStatus"
).textContent =
"PENDING";


document.getElementById(
"ticketResult"
).classList.remove(
"hidden"
);


/* QR */

document.getElementById(
"qrcode"
).innerHTML =
"";


new QRCode(

document.getElementById(
"qrcode"
),

{

text: ticketId,

width: 180,

height: 180

}

);


button.textContent =
"Ticket Created";


} catch (error) {


console.error(error);


message.textContent =
"JAVASCRIPT ERROR: " +
error.message;


button.disabled =
false;

button.textContent =
"Submit Ticket Order";

}

});

</script>

</body>
</html>
