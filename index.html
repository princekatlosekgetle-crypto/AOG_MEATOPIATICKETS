<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meatopia Online Ticket</title>

  <!-- Our stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- QR Code Library -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="container nav">

      <div class="logo">
        MEATOPIA
      </div>

      <nav class="nav-links">
        <a href="index.html">Ticket</a>
        <a href="verify.html">Verify Ticket</a>
        <a href="admin.html">Admin</a>
      </nav>

    </div>
  </header>


  <!-- MAIN -->
  <main>

    <div class="container">

      <div class="text-center">
        <h1>Meatopia Online Ticket</h1>
        <p>
          Create your digital event ticket.
        </p>
      </div>


      <!-- TICKET CREATION FORM -->

      <div class="card">

        <h2>Create Ticket</h2>

        <form id="ticketForm">

          <div class="form-group">

            <label for="customerName">
              Ticket Holder Name
            </label>

            <input
              type="text"
              id="customerName"
              placeholder="Enter full name"
              required
            >

          </div>


          <div class="form-group">

            <label for="ticketTypeInput">
              Ticket Type
            </label>

            <select
              id="ticketTypeInput"
              required
            >

              <option value="">
                Select ticket type
              </option>

              <option value="General Access">
                General Access
              </option>

              <option value="VIP">
                VIP
              </option>

            </select>

          </div>


          <button
            type="submit"
            class="btn"
          >
            Generate Ticket
          </button>

        </form>

      </div>


      <!-- GENERATED TICKET -->

      <div
        id="ticketResult"
        class="hidden"
      >

        <div class="ticket">

          <!-- TICKET HEADER -->

          <div class="ticket-header">

            <h1>
              MEATOPIA
            </h1>

            <p>
              OFFICIAL ONLINE TICKET
            </p>

          </div>


          <!-- TICKET BODY -->

          <div class="ticket-body">

            <div class="ticket-row">

              <span class="ticket-label">
                Ticket Holder
              </span>

              <span
                id="ticketName"
                class="ticket-value"
              >
              </span>

            </div>


            <div class="ticket-row">

              <span class="ticket-label">
                Ticket Type
              </span>

              <span
                id="ticketType"
                class="ticket-value"
              >
              </span>

            </div>


            <div class="ticket-row">

              <span class="ticket-label">
                Ticket ID
              </span>

              <span
                id="ticketId"
                class="ticket-value"
              >
              </span>

            </div>


            <div class="ticket-row">

              <span class="ticket-label">
                Status
              </span>

              <span
                id="ticketStatus"
                class="ticket-value"
              >
                VALID
              </span>

            </div>


            <!-- QR CODE -->

            <div class="qr-container">

              <div id="qrcode"></div>

            </div>


            <div class="text-center">

              <p>
                Scan this QR code to verify
                the authenticity of this ticket.
              </p>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="container">

      <p>
        © 2026 Meatopia. All rights reserved.
      </p>

    </div>

  </footer>


  <!-- Our JavaScript -->

  <script src="script.js"></script>

</body>
</html>
