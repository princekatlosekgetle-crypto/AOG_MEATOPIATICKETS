<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meatopia | Official Tickets</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="container nav">

      <div class="logo">
        MEATOPIA
      </div>

      <nav class="nav-links">

        <a href="index.html">
          Tickets
        </a>

      </nav>

    </div>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <div class="container">


      <!-- EVENT INFORMATION -->

      <section class="hero">

        <h1>
          MEATOPIA
        </h1>

        <p>
          OFFICIAL ONLINE TICKETS
        </p>

        <p>
          30 September 2026
          •
          Moshupa AOG
        </p>

      </section>



      <!-- =========================
           TICKET FORM
      ========================== -->

      <section class="card">

        <h2>
          Get Your Ticket
        </h2>

        <p>
          Enter the ticket holder's name
          and select a ticket type.
        </p>


        <form id="ticketForm">


          <!-- NAME -->

          <div class="form-group">

            <label for="customerName">

              Ticket Holder Name

            </label>


            <input

              type="text"

              id="customerName"

              name="customerName"

              placeholder="Enter full name"

              autocomplete="name"

              required

            >

          </div>



          <!-- TICKET TYPE -->

          <div class="form-group">

            <label for="ticketTypeInput">

              Ticket Type

            </label>


            <select

              id="ticketTypeInput"

              name="ticketType"

              required

            >

              <option value="">

                Select ticket type

              </option>


              <option value="Early Bird">

                Early Bird — P80

              </option>


              <option value="Standard">

                Standard — P100

              </option>


              <option value="Children">

                Children — P50

              </option>


              <option value="Group">

                Group — P500

              </option>

            </select>

          </div>



          <!-- GENERATE BUTTON -->

          <button

            type="submit"

            class="btn"

            id="generateTicketButton"

          >

            Generate Ticket

          </button>


        </form>

      </section>



      <!-- =========================
           GENERATED TICKET
      ========================== -->

      <section

        id="ticketResult"

        class="hidden"

      >


        <div class="ticket">


          <!-- TICKET HEADER -->

          <div class="ticket-header">

            <h1>
              MEATOPIA
            </h1>

            <p>
              OFFICIAL EVENT TICKET
            </p>

          </div>



          <!-- TICKET DETAILS -->

          <div class="ticket-body">


            <div class="ticket-row">

              <span class="ticket-label">

                Ticket Holder

              </span>


              <span

                id="ticketName"

                class="ticket-value"

              ></span>

            </div>



            <div class="ticket-row">

              <span class="ticket-label">

                Ticket Type

              </span>


              <span

                id="ticketType"

                class="ticket-value"

              ></span>

            </div>



            <div class="ticket-row">

              <span class="ticket-label">

                Ticket ID

              </span>


              <span

                id="ticketId"

                class="ticket-value"

              ></span>

            </div>



            <div class="ticket-row">

              <span class="ticket-label">

                Event

              </span>


              <span class="ticket-value">

                Meatopia

              </span>

            </div>



            <div class="ticket-row">

              <span class="ticket-label">

                Date

              </span>


              <span class="ticket-value">

                30 September 2026

              </span>

            </div>

              <span class="ticket-label">

                Venue

              </span>
