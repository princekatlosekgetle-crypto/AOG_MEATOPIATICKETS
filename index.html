<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meatopia Tickets</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="container nav">
    <div class="logo">MEATOPIA</div>

    <nav class="nav-links">
      <a href="index.html">Tickets</a>
      <a href="verify.html">Verify</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
</header>


<main>

<div class="container">

<section class="hero">
  <h1>MEATOPIA</h1>
  <p>OFFICIAL ONLINE TICKETS</p>
  <p>30 September 2026 • Moshupa AOG</p>
</section>


<section class="card">

<h2>Get Your Ticket</h2>

<form id="ticketForm">

<div class="form-group">
<label>Ticket Holder Name</label>

<input
  id="customerName"
  type="text"
  placeholder="Enter full name"
  required
>
</div>


<div class="form-group">
<label>Ticket Type</label>

<select id="ticketType" required>

<option value="">Select ticket type</option>

<option value="Early Bird">Early Bird — P80</option>

<option value="Standard">Standard — P100</option>

<option value="Children">Children — P50</option>

<option value="Group">Group — P500</option>

</select>
</div>


<button
  type="submit"
  class="btn"
  id="submitButton"
>
Submit Ticket Order
</button>

</form>


<div
  id="message"
  style="margin-top:20px;font-weight:bold;"
>
READY
</div>

</section>


<section
  id="ticketResult"
  class="card hidden"
>

<h2>Ticket Created</h2>

<p>
<strong>Holder:</strong>
<span id="displayName"></span>
</p>

<p>
<strong>Type:</strong>
<span id="displayType"></span>
</p>

<p>
<strong>Price:</strong>
<span id="displayPrice"></span>
</p>

<p>
<strong>Ticket ID:</strong>
<span id="displayTicketId"></span>
</p>

<p>
<strong>Status:</strong>
<span id="displayStatus">PENDING</span
