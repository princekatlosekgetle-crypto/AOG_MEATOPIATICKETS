<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meatopia | Staff Admin</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="container nav">

      <div class="logo">
        MEATOPIA
      </div>


      <nav class="nav-links">

        <a href="index.html">
          Tickets
        </a>

        <a href="verify.html">
          Verify
        </a>

        <a href="admin.html">
          Admin
        </a>

      </nav>

    </div>

  </header>



  <!-- MAIN -->

  <main>

    <div class="container">


      <!-- ADMIN LOGIN -->

      <section
        id="adminLogin"
        class="card"
      >

        <h1>
          Staff Admin
        </h1>

        <p>
          Authorized staff only.
        </p>


        <form id="adminLoginForm">


          <div class="form-group">

            <label for="adminUsername">
              Username
            </label>


            <input
              type="text"
              id="adminUsername"
              placeholder="Staff username"
              autocomplete="username"
              required
            >

          </div>



          <div class="form-group">

            <label for="adminPassword">
              Password
            </label>


            <input
              type="password"
              id="adminPassword"
              placeholder="Staff password"
              autocomplete="current-password"
              required
            >

          </div>



          <button
            type="submit"
            class="btn"
          >
            Staff Login
          </button>


        </form>


        <p
          id="adminLoginMessage"
          class="error-message"
        ></p>

      </section>



      <!-- ADMIN DASHBOARD -->

      <section
        id="adminDashboard"
        class="hidden"
      >


        <section class="hero">

          <h1>
            Admin Dashboard
          </h1>

          <p>
            Meatopia Ticket Management
          </p>

        </section>



        <!-- STATISTICS -->

        <section class="card">

          <h2>
            Ticket Statistics
          </h2>


          <div class="ticket-stats">


            <div class="stat">

              <strong
                id="totalTickets"
              >
                0
              </strong>

              <span>
                Total Tickets
              </span>

            </div>


            <div class="stat">

              <strong
                id="validTickets"
              >
                0
              </strong>

              <span>
                Valid Tickets
              </span>

            </div>


            <div class="stat">

              <strong
                id="usedTickets"
              >
                0
              </strong>

              <span>
                Used Tickets
              </span>

            </div>


          </div>

        </section>



        <!-- TICKET LIST -->

        <section class="card">

          <h2>
            Tickets
          </h2>


          <div
            id="ticketList"
          >

            <p>
              No tickets available.
            </p>

          </div>

        </section>



        <!-- LOGOUT -->

        <section class="card">

          <button
            id="adminLogout"
            class="btn"
          >
            Logout
          </button>

        </section>


      </section>


    </div>

  </main>



  <!-- FOOTER -->

  <footer>

    <div class="container">

      <p>
        © 2026 Meatopia
      </p>

    </div>

  </footer>



  <script src="script.js"></script>
<!-- Supabase Authentication -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://kqvekxywsyjuhjggwrpa.supabase.co";
const SUPABASE_KEY = "sb_publishable_-j0nUXgSet2ihzJimLkSZg_hHimaaPm";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Check whether the admin is logged in
async function checkAdminLogin() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "index.html";
        return;
    }

    console.log("Admin logged in:", session.user.email);
}

checkAdminLogin();

// Logout function
async function logoutAdmin() {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
}
</script>
</body>

</html>
