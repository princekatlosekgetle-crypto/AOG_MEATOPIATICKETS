<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Meatopia | Admin</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>


<header>

<div class="container nav">

<div class="logo">
MEATOPIA
</div>


<nav class="nav-links">

<a href="index.html">
Tickets
</a>

<a href="verify.html">
Verify
</a>

<a href="admin.html">
Admin
</a>

</nav>

</div>

</header>



<main>

<div class="container">


<!-- LOGIN -->

<section
id="loginSection"
class="card"
>

<h1>
Staff Admin Login
</h1>

<p>
Authorized staff only.
</p>


<form id="loginForm">


<div class="form-group">

<label for="email">
Email
</label>

<input
id="email"
type="email"
placeholder="Admin email"
autocomplete="email"
required
>

</div>



<div class="form-group">

<label for="password">
Password
</label>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
required
>

</div>



<button
type="submit"
class="btn"
id="loginButton"
>

Login

</button>


</form>


<p id="loginMessage"></p>

</section>



<!-- DASHBOARD -->

<section
id="dashboard"
class="hidden"
>


<section class="hero">

<h1>
Admin Dashboard
</h1>

<p>
Meatopia Ticket Management
</p>

</section>



<!-- STATS -->

<section class="card">

<h2>
Ticket Statistics
</h2>


<div class="ticket-stats">


<div class="stat">

<strong id="totalTickets">
0
</strong>

<span>
Total
</span>

</div>



<div class="stat">

<strong id="pendingTickets">
0
</strong>

<span>
Pending
</span>

</div>



<div class="stat">

<strong id="validTickets">
0
</strong>

<span>
Valid
</span>

</div>



<div class="stat">

<strong id="usedTickets">
0
</strong>

<span>
Used
</span>

</div>


</div>

</section>



<!-- TICKETS -->

<section class="card">

<div
style="display:flex;justify-content:space-between;align-items:center;gap:10px;"
>

<h2>
Tickets
</h2>


<button
id="refreshButton"
class="btn"
type="button"
>

Refresh

</button>

</div>


<div id="ticketList">

<p>
Loading tickets...
</p>

</div>

</section>



<!-- LOGOUT -->

<section class="card">

<button
id="logoutButton"
class="btn"
type="button"
>

Logout

</button>

</section>


</section>


</div>

</main>



<footer>

<div class="container">

<p>
© 2026 Meatopia
</p>

</div>

</footer>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


const SUPABASE_URL =
"https://kqvekxywsyjuhjggwrpa.supabase.co";


const SUPABASE_KEY =
"sb_publishable_-j0nUXgSet2ihzJimLkSZg_hHimaaPm";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const loginSection =
document.getElementById(
"loginSection"
);


const dashboard =
document.getElementById(
"dashboard"
);


const loginForm =
document.getElementById(
"loginForm"
);


const loginMessage =
document.getElementById(
"loginMessage"
);


const ticketList =
document.getElementById(
"ticketList"
);



/* CHECK LOGIN */


async function checkLogin() {


const {
data
} =
await supabaseClient.auth.getSession();


if (
data.session
) {

showDashboard();

} else {

showLogin();

}

}



/* SHOW LOGIN */


function showLogin() {

loginSection.classList.remove(
"hidden"
);

dashboard.classList.add(
"hidden"
);

}



/* SHOW DASHBOARD */


function showDashboard() {

loginSection.classList.add(
"hidden"
);

dashboard.classList.remove(
"hidden"
);

loadTickets();

}



/* LOGIN */


loginForm.addEventListener(
"submit",
async function(event) {

event.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const button =
document.getElementById(
"loginButton"
);


button.disabled =
true;


button.textContent =
"Logging in...";


loginMessage.textContent =
"";


const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});


if (error) {

loginMessage.textContent =
error.message;

button.disabled =
false;

button.textContent =
"Login";

return;

}


showDashboard();


}
);



/* LOAD TICKETS */


async function loadTickets() {


ticketList.innerHTML =
"<p>Loading tickets...</p>";


const {
data: tickets,
error
} =
await supabaseClient
.from("Tickets.aog")
.select("*")
.order(
"created_at",
{
ascending: false
}
);


if (error) {

ticketList.innerHTML =
"<p>Unable to load tickets: " +
error.message +
"</p>";

console.error(error);

return;

}


updateStatistics(
tickets || []
);


if (
!tickets ||
tickets.length === 0
) {

ticketList.innerHTML =
"<p>No tickets found.</p>";

return;

}


ticketList.innerHTML = "";


tickets.forEach(
function(ticket) {

const card =
document.createElement(
"div"
);


card.className =
"card";


card.style.marginTop =
"15px";


const status =
String(
ticket.status || ""
)
.toLowerCase();


card.innerHTML = `

<h3>
${escapeHtml(ticket.holder_name)}
</h3>

<p>
<strong>Ticket ID:</strong>
${escapeHtml(ticket.ticket_id)}
</p>

<p>
<strong>Type:</strong>
${escapeHtml(ticket.ticket_type)}
</p>

<p>
<strong>Price:</strong>
P${escapeHtml(ticket.price)}
</p>

<p>
<strong>Status:</strong>
${escapeHtml(ticket.status)}
</p>

<p>
<strong>Date:</strong>
${escapeHtml(ticket.event_date)}
</p>

<p>
<strong>Venue:</strong>
${escapeHtml(ticket.venue)}
</p>

<div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap;">

${
status === "pending"
?

`

<button
class="btn approve-button"
data-id="${escapeHtml(ticket.ticket_id)}"
type="button"
>
Approve Payment
</button>

`

:

""

}

${
status === "valid"
?

`

<button
class="btn used-button"
data-id="${escapeHtml(ticket.ticket_id)}"
type="button"
>
Mark Used
</button>

`

:

""

}

</div>

`;


ticketList.appendChild(
card
);

}

);


}



/* STATISTICS */


function updateStatistics(
tickets
) {


let pending = 0;

let valid = 0;

let used = 0;


tickets.forEach(
function(ticket) {

const status =
String(
ticket.status || ""
)
.toLowerCase();


if (
status === "pending"
) {

pending++;

}


if (
status === "valid"
) {

valid++;

}


if (
status === "used"
) {

used++;

}

});


document.getElementById(
"totalTickets"
).textContent =
tickets.length;


document.getElementById(
"pendingTickets"
).textContent =
pending;


document.getElementById(
"validTickets"
).textContent =
valid;


document.getElementById(
"usedTickets"
).textContent =
used;

}



/* APPROVE / MARK USED */


ticketList.addEventListener(
"click",
async function(event) {


const button =
event.target.closest(
"button"
);


if (!button) {
return;
}


const ticketId =
button.dataset.id;


if (
button.classList.contains(
"approve-button"
)
) {

await changeStatus(
ticketId,
"valid"
);

}


if (
button.classList.contains(
"used-button"
)
) {

await changeStatus(
ticketId,
"used"
);

}

});



/* CHANGE STATUS */


async function changeStatus(
ticketId,
newStatus
) {


const confirmed =
confirm(
"Change ticket " +
ticketId +
" to " +
newStatus +
"?"
);


if (!confirmed) {
return;
}


const {
error
} =
await supabaseClient
.from("Tickets.aog")
.update({

status: newStatus

})
.eq(
"ticket_id",
ticketId
);


if (error) {

alert(
"Update failed: " +
error.message
);

console.error(error);

return;

}


loadTickets();

}



/* ESCAPE HTML */


function escapeHtml(
value
) {

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}



/* REFRESH */


document.getElementById(
"refreshButton"
).addEventListener(
"click",
loadTickets
);



/* LOGOUT */


document.getElementById(
"logoutButton"
).addEventListener(
"click",
async function() {

await supabaseClient.auth.signOut();

showLogin();

}
);



/* START */


checkLogin();


</script>


</body>

</html>
