<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


const SUPABASE_URL =
"https://kqvekxywsyjuhjggwrpa.supabase.co";


const SUPABASE_KEY =
"sb_publishable_-j0nUXgSet2ihzJimLkSZg_hHimaaPm";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const form =
document.getElementById(
"verifyForm"
);


const input =
document.getElementById(
"ticketId"
);


const result =
document.getElementById(
"result"
);


const button =
document.getElementById(
"verifyButton"
);



form.addEventListener(
"submit",
async function(event) {


event.preventDefault();


const ticketId =
input.value
.trim()
.toUpperCase();


if (!ticketId) {

result.innerHTML =
"<p>Please enter a Ticket ID.</p>";

return;

}


button.disabled =
true;

button.textContent =
"Checking...";


result.innerHTML =
"<p>Checking ticket...</p>";



const {
data,
error
} =
await supabaseClient
.from("Tickets.aog")
.select("*")
.eq(
"ticket_id",
ticketId
)
.maybeSingle();



if (error) {

console.error(error);


result.innerHTML = `

<div class="card">

<h2>
Verification Error
</h2>

<p>
${escapeHtml(error.message)}
</p>

</div>

`;


button.disabled =
false;

button.textContent =
"Verify Ticket";

return;

}



if (!data) {

result.innerHTML = `

<div class="card">

<h2>
❌ TICKET NOT FOUND
</h2>

<p>
No ticket with ID
<strong>${escapeHtml(ticketId)}</strong>
was found.
</p>

</div>

`;


button.disabled =
false;

button.textContent =
"Verify Ticket";

return;

}



const status =
String(
data.status
)
.toLowerCase();



if (status === "pending") {


result.innerHTML = `

<div class="card">

<h2>
🟡 PAYMENT PENDING
</h2>

<p>
<strong>${escapeHtml(data.holder_name)}</strong>
</p>

<p>
Ticket ID:
<strong>${escapeHtml(data.ticket_id)}</strong>
</p>

<p>
Ticket Type:
${escapeHtml(data.ticket_type)}
</p>

<p>
This ticket has not been approved for entry.
</p>

</div>

`;

}



else if (status === "valid") {


result.innerHTML = `

<div class="card">

<h2>
🟢 VALID TICKET
</h2>

<p>
<strong>${escapeHtml(data.holder_name)}</strong>
</p>

<p>
Ticket ID:
<strong>${escapeHtml(data.ticket_id)}</strong>
</p>

<p>
Ticket Type:
${escapeHtml(data.ticket_type)}
</p>

<p>
Price:
P${escapeHtml(data.price)}
</p>

<p>
Event:
Meatopia
</p>

<p>
30 September 2026
</p>

<p>
Moshupa AOG
</p>

<button
class="btn"
id="useTicketButton"
type="button"
>
MARK TICKET AS USED
</button>

</div>

`;


document
.getElementById(
"useTicketButton"
)
.addEventListener(
"click",
function() {

markTicketUsed(
data.ticket_id
);

});

}



else if (status === "used") {


result.innerHTML = `

<div class="card">

<h2>
🔴 TICKET ALREADY USED
</h2>

<p>
<strong>${escapeHtml(data.holder_name)}</strong>
</p>

<p>
Ticket ID:
<strong>${escapeHtml(data.ticket_id)}</strong>
</p>

<p>
This ticket has already been used.
</p>

<p>
<strong
