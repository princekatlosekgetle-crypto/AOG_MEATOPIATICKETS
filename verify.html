<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


/* SUPABASE */

const SUPABASE_URL =
"https://kqvekxywsyjuhjggwrpa.supabase.co";


const SUPABASE_KEY =
"sb_publishable_-j0nUXgSet2ihzJimLkSZg_hHimaaPm";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



/* ELEMENTS */

const loginSection =
document.getElementById(
"loginSection"
);

const verificationSection =
document.getElementById(
"verificationSection"
);

const loginForm =
document.getElementById(
"loginForm"
);

const loginMessage =
document.getElementById(
"loginMessage"
);

const verificationResult =
document.getElementById(
"verificationResult"
);



/* CHECK SESSION */

async function checkSession() {

const {
data
} =
await supabaseClient.auth.getSession();


if (data.session) {

showVerification();

} else {

showLogin();

}

}



/* SHOW LOGIN */

function showLogin() {

loginSection.classList.remove(
"hidden"
);

verificationSection.classList.add(
"hidden"
);

}



/* SHOW VERIFICATION */

function showVerification() {

loginSection.classList.add(
"hidden"
);

verificationSection.classList.remove(
"hidden"
);

}



/* LOGIN */

loginForm.addEventListener(
"submit",
async function(event) {

event.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const button =
document.getElementById(
"loginButton"
);


button.disabled =
true;

button.textContent =
"Logging in...";


loginMessage.textContent =
"";


const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});


if (error) {

loginMessage.textContent =
error.message;

button.disabled =
false;

button.textContent =
"Staff Login";

return;

}


showVerification();

}
);



/* VERIFY TICKET */

document
.getElementById(
"verifyForm"
)
.addEventListener(
"submit",
async function(event) {

event.preventDefault();


const ticketId =
document
.getElementById("ticketId")
.value
.trim()
.toUpperCase();


const button =
document.getElementById(
"verifyButton"
);


button.disabled =
true;

button.textContent =
"Checking...";


verificationResult.innerHTML =
"<p>Checking ticket...</p>";


const {
data,
error
} =
await supabaseClient
.from("Tickets.aog")
.select("*")
.eq(
"ticket_id",
ticketId
)
.maybeSingle();


if (error) {

verificationResult.innerHTML =
"<p><strong>Error:</strong> " +
escapeHtml(error.message) +
"</p>";

button.disabled =
false;

button.textContent =
"Verify Ticket";

return;

}


if (!data) {

verificationResult.innerHTML = `

<div class="card">

<h2>
❌ TICKET NOT FOUND
</h2>

<p>
No ticket was found with ID:
</p>

<strong>
${escapeHtml(ticketId)}
</strong>

</div>

`;

button.disabled =
false;

button.textContent =
"Verify Ticket";

return;

}


const status =
String(
data.status
)
.toLowerCase();



/* PENDING */

if (
status === "pending"
) {

verificationResult.innerHTML = `

<div class="card">

<h2>
🟡
