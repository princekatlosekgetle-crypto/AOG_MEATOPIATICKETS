<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meatopia | Staff Verification</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="container nav">

      <div class="logo">
        MEATOPIA
      </div>


      <nav class="nav-links">

        <a href="index.html">
          Tickets
        </a>

        <a href="verify.html">
          Verify
        </a>

        <a href="admin.html">
          Admin
        </a>

      </nav>

    </div>

  </header>



  <!-- MAIN -->

  <main>

    <div class="container">


      <!-- STAFF LOGIN -->

      <section
        id="staffLogin"
        class="card"
      >

        <h1>
          Staff Verification
        </h1>

        <p>
          Authorized staff only.
        </p>


        <form id="staffLoginForm">


          <div class="form-group">

            <label for="staffEmail">
              Staff Email
            </label>


            <input
              type="email"
              id="staffEmail"
              placeholder="Staff email"
              autocomplete="email"
              required
            >

          </div>



          <div class="form-group">

            <label for="staffPassword">
              Password
            </label>


            <input
              type="password"
              id="staffPassword"
              placeholder="Staff password"
              autocomplete="current-password"
              required
            >

          </div>



          <button
            type="submit"
            class="btn"
            id="staffLoginButton"
          >
            Staff Login
          </button>


        </form>


        <p
          id="loginMessage"
          class="error-message"
        ></p>

      </section>



      <!-- VERIFICATION AREA -->

      <section
        id="verificationArea"
        class="card hidden"
      >

        <h1>
          Verify Ticket
        </h1>

        <p>
          Enter the unique Ticket ID.
        </p>


        <p id="loggedInStaff"></p>


        <form id="verifyForm">


          <div class="form-group">

            <label for="ticketIdInput">
              Ticket ID
            </label>


            <input
              type="text"
              id="ticketIdInput"
              placeholder="Example: MTP-ABCD1234"
              required
            >

          </div>

            type="submit"
